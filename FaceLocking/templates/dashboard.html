<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENAX Speaker Tracking — Live Log</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: #0a0a0a;
            color: #00ff88;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #111;
            padding: 12px 20px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1rem;
            font-weight: 600;
            color: #00ff88;
        }
        .status {
            font-size: 0.75rem;
            color: #666;
        }
        .status.online { color: #00ff88; }
        .status.offline { color: #ff4444; }
        #logContainer {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
            font-size: 0.85rem;
            line-height: 1.7;
        }
        .log-line {
            padding: 2px 0;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            gap: 12px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }
        .log-time {
            color: #555;
            min-width: 75px;
            flex-shrink: 0;
        }
        .log-msg {
            color: #ccc;
        }
        .log-msg.locked { color: #00ff88; }
        .log-msg.tracking { color: #66ccff; }
        .log-msg.searching { color: #ffaa44; }
        .log-msg.moved { color: #ff6666; }
        .log-msg.stopped { color: #888; }
        .footer {
            background: #111;
            padding: 8px 20px;
            border-top: 1px solid #222;
            font-size: 0.75rem;
            color: #444;
            display: flex;
            justify-content: space-between;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>BENAX Speaker Tracking — Live Log</h1>
        <span class="status" id="connStatus">Connecting...</span>
    </div>
    <div id="logContainer">
        <div class="log-line"><span class="log-time">--:--:--</span><span class="log-msg">Waiting for tracker...</span></div>
    </div>
    <div class="footer">
        <span>Auto-refresh every 500ms</span>
        <span id="entryCount">0 entries</span>
    </div>

    <script>
        let lastLogCount = 0;

        function getMsgClass(msg) {
            msg = msg.toLowerCase();
            if (msg.includes('locked')) return 'locked';
            if (msg.includes('tracking')) return 'tracking';
            if (msg.includes('search')) return 'searching';
            if (msg.includes('move')) return 'moved';
            if (msg.includes('stopped') || msg.includes('hold')) return 'stopped';
            return '';
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                document.getElementById('connStatus').textContent = 'Live';
                document.getElementById('connStatus').className = 'status online';

                const logs = data.log_entries || [];
                const container = document.getElementById('logContainer');

                if (logs.length > lastLogCount) {
                    const newLogs = logs.slice(lastLogCount);
                    newLogs.forEach(e => {
                        const line = document.createElement('div');
                        line.className = 'log-line';
                        const cls = getMsgClass(e.message);
                        line.innerHTML = `<span class="log-time">${e.time}</span><span class="log-msg ${cls}">${e.message}</span>`;
                        container.appendChild(line);
                    });
                    container.scrollTop = container.scrollHeight;
                    lastLogCount = logs.length;
                }

                document.getElementById('entryCount').textContent = lastLogCount + ' entries';
            } catch (e) {
                document.getElementById('connStatus').textContent = 'Disconnected';
                document.getElementById('connStatus').className = 'status offline';
            }
        }

        setInterval(fetchStatus, 500);
        fetchStatus();
    </script>
</body>
</html>
